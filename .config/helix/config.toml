# https://github.com/helix-editor/helix/pull/14356
[theme]
# https://github.com/helix-editor/helix/pull/14809
light = "omicron_light"
dark = "omicron_dark"
fallback = "dl" # for Termux

[editor]
# https://github.com/helix-editor/helix/pull/15820
gutters.layout = ["diagnostics", "code-action-hint", "spacer", "diff"]
whitespace.render = { nbsp = "all", nnbsp = "all" }
# https://github.com/helix-editor/helix/pull/13206
word-completion = { enable = true, trigger-length = 1 }
cursorline = true
# I know `<space>b`, but I want to "punish" myself
# for having too many buffers
bufferline = "multiple"
color-modes = true

# why not show `mode` via `cursor-shape` instead of status-line?
# gnome-term renders thin lines

[editor.statusline]
mode = { normal = "^", insert = "i", select = "v" }
# `total-line-numbers` is an alt for `position-percentage`.
# Despite my love for fractions, "%" is complementary
# (presentation-wise, not information-wise)
# and it's always short.
# TO-DO: replace by [scrollbar](https://github.com/helix-editor/helix/pull/5749)
# when merged.
right = [
	"diagnostics",
	"selections",
	"register",
	"position-percentage",
	"position",
	"file-encoding",
]

[editor.lsp]
# prevent auto-{exec,start}
# TO-DO: replace by https://github.com/helix-editor/helix/pull/12085
enable = false
display-inlay-hints = true
inlay-hints-length-limit = 32 # half ~70char
display-progress-messages = true

[keys.normal]
"+" = "increment"
"-" = "decrement"
# EMACS certified
"C-k" = "kill_to_line_end"
"A-k" = ["extend_to_line_bounds", "delete_selection"]
[keys.normal.backspace]
# https://github.com/helix-editor/helix/issues/3519#issuecomment-4961717768
c = """@\
<C-s>\
:n<ret><A-d>\
"pp\
<C-o>\
:set-register p %{file_path_absolute}<ret>\
<C-i>\
"pP\
F/\
<A-d>\
h\
vgg\
:cd %{selection}<ret>\
<A-d>\
%"py\
:bc!<ret>\
<C-o>\
"""
# for global search
h = ":toggle file-picker.hidden"
# zen-mode
# bug: https://github.com/helix-editor/helix/issues/13187
#z = [
#	":set gutters.layout []",
#	":set cursorline false",
#	":set whitespace.render none",
#	":set lsp.display-inlay-hints false",
#	":set inline-diagnostics.cursor-line disable",
#	":set end-of-line-diagnostics disable",
#	":set statusline.diagnostics []",
#	":set statusline.workspace-diagnostics []",
#]
# toggle line-numbers;
# I now understand why Scheme is better than TOML:
# https://github.com/helix-editor/helix/issues/8853
l = """
:toggle gutters.layout \
[\"diagnostics\", \"code-action-hint\", \"spacer\", \"line-numbers\", \"spacer\", \"diff\"] \
[\"diagnostics\", \"code-action-hint\", \"spacer\", \"diff\"]
"""
# useful even for hard-wrapped prose,
# and to reveal malware hidden outside the view-port
w = ":toggle soft-wrap.enable"
s.s = ["save_selection", "split_selection_on_newline", ":sort", "jump_backward"]
s.i = [
	"save_selection",
	"split_selection_on_newline",
	":sort -i",
	"jump_backward",
]
# arithmetic evaluation
"=" = ":! bcl << DEADBEEF-EOF\n%{selection}\nDEADBEEF-EOF"
# balance between easy-switch and prompting
p.e = ":toggle lsp.enable"
p.r = ":lsp-restart"
p.s = ":lsp-stop"
p.i = ":toggle lsp.display-inlay-hints"
[keys.select]
"+" = "increment"
"-" = "decrement"
"C-k" = "kill_to_line_end"
"A-k" = ["extend_to_line_bounds", "delete_selection"]
[keys.select.backspace]
# `|bcl` is too short for a keybind
"=" = ":echo %sh{bcl << DEADBEEF-EOF\n%{selection}\nDEADBEEF-EOF}"
p.e = ":toggle lsp.enable"
p.r = ":lsp-restart"
p.s = ":lsp-stop"
p.i = ":set lsp.display-inlay-hints false"
[keys.insert]
"C-k" = "kill_to_line_end"
"A-k" = ["extend_to_line_bounds", "delete_selection"]
